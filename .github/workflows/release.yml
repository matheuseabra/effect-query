name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11.5.1+, required for OIDC trusted publishing.
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # npm CLI (not pnpm) performs the OIDC token exchange for publishing.
      # Prereleases publish under their own dist-tag so `latest` stays clean.
      - run: |
          TAG=$(node -p "/-/.test(require('./package.json').version) ? require('./package.json').version.split('-')[1].split('.')[0] : 'latest'")
          npm publish --tag "$TAG" --no-git-checks

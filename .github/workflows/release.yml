name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11.5.1+, required for OIDC trusted publishing.
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify release versions match the tag
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const core = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const react = JSON.parse(fs.readFileSync("packages/react/package.json", "utf8"));
            if (core.version !== react.version || process.env.GITHUB_REF_NAME !== `v${core.version}`) {
              throw new Error("Release tag and package versions must match");
            }
          '
      # pnpm resolves workspace dependencies to registry versions when packing.
      - run: pnpm pack --out effect-query.tgz
      - run: pnpm pack --out ../../effect-query-react.tgz
        working-directory: packages/react
      # npm CLI (not pnpm) performs the OIDC token exchange for publishing.
      # Prereleases publish under their own dist-tag so `latest` stays clean.
      - run: |
          TAG=$(node -p "/-/.test(require('./package.json').version) ? require('./package.json').version.split('-')[1].split('.')[0] : 'latest'")
          npm publish ./effect-query.tgz --provenance --tag "$TAG"
          npm publish ./effect-query-react.tgz --provenance --tag "$TAG"
